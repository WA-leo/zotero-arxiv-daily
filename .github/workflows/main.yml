name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_INCLUDE_PATH: ${{ vars.ZOTERO_INCLUDE_PATH }}
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES || 'cs.NI,cs.AI,cs.LG,cs.CL' }}
          TLDR_LANGUAGE: ${{ vars.TLDR_LANGUAGE || 'Chinese' }}
          REVIEW_MAX_PAPER_NUM: ${{ vars.REVIEW_MAX_PAPER_NUM || '10' }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.126.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          LLM_MODEL: ${{ secrets.MODEL_NAME }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          run_args=(
            "source.arxiv.category=[$ARXIV_CATEGORIES]"
            "llm.language=$TLDR_LANGUAGE"
            "executor.max_paper_num=$REVIEW_MAX_PAPER_NUM"
            "email.smtp_server=$SMTP_SERVER"
            "email.smtp_port=$SMTP_PORT"
          )
          if [ -n "$ZOTERO_INCLUDE_PATH" ]; then
            run_args+=("zotero.include_path=$ZOTERO_INCLUDE_PATH")
          fi
          if [ -n "$LLM_MODEL" ]; then
            run_args+=("llm.generation_kwargs.model=$LLM_MODEL")
          fi
          uv run src/zotero_arxiv_daily/main.py "${run_args[@]}"

      - name: Summarize review queue outcome
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          review_path = Path("review.json")
          if not review_path.exists():
              summary.write_text("## Review queue\n\nNo `review.json` was produced.\n", encoding="utf-8")
          else:
              review = json.loads(review_path.read_text(encoding="utf-8"))
              error = review.get("error") or {}
              lines = [
                  "## Review queue",
                  "",
                  f"- Status: `{review.get('status', 'unknown')}`",
                  f"- Candidate count: `{len(review.get('papers', []))}`",
              ]
              if error.get("type"):
                  lines.append(f"- Failure type: `{error['type']}`")
              if error.get("remediation"):
                  lines.append(f"- Action: {error['remediation']}")
              summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zotero-arxiv-daily-review-${{ github.run_id }}
          path: review.json
          if-no-files-found: error
          retention-days: 30
