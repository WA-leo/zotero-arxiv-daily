name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_INCLUDE_PATH: ${{ vars.ZOTERO_INCLUDE_PATH }}
          ARXIV_CATEGORIES: ${{ vars.ARXIV_CATEGORIES || 'cs.NI,cs.AI,cs.LG,cs.CL' }}
          TLDR_LANGUAGE: ${{ vars.TLDR_LANGUAGE || 'Chinese' }}
          REVIEW_MAX_PAPER_NUM: ${{ vars.REVIEW_MAX_PAPER_NUM || '10' }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          LLM_MODEL: ${{ secrets.MODEL_NAME }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          export DEBUG=true
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          run_args=(
            "source.arxiv.category=[$ARXIV_CATEGORIES]"
            "llm.language=$TLDR_LANGUAGE"
            "executor.max_paper_num=$REVIEW_MAX_PAPER_NUM"
          )
          if [ -n "$ZOTERO_INCLUDE_PATH" ]; then
            run_args+=("zotero.include_path=$ZOTERO_INCLUDE_PATH")
          fi
          if [ -n "$LLM_MODEL" ]; then
            run_args+=("llm.generation_kwargs.model=$LLM_MODEL")
          fi
          uv run src/zotero_arxiv_daily/main.py "${run_args[@]}"

      - name: Upload review queue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zotero-arxiv-daily-review-test-${{ github.run_id }}
          path: review.json
          if-no-files-found: error
          retention-days: 7
